<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      CSP allowlist (build-plan §4): runtime origins are the public AppView
      (feed reads), the Bluesky blob CDN (images), the PLC directory (DID→PDS
      resolution), and bsky-network PDS hosts (guardian config getRecord). Other
      PDS hosts are not statically allowlistable; the local-only config fallback
      covers guardians off bsky-network. No inline script/style — all 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://cdn.bsky.app https://*.cdn.bsky.app; connect-src 'self' https://public.api.bsky.app https://plc.directory https://bsky.social https://*.host.bsky.network; manifest-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Skylite</title>
    <meta name="description" content="A window to the stars — a read-only, curated Bluesky garden." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="%STYLES%" />

    <meta name="theme-color" content="#14164b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Skylite" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <header class="topbar">
      <span class="topbar__moon" aria-hidden="true"></span>
      <h1 class="topbar__wordmark">Skylite</h1>
      <p class="topbar__tagline">A window to the stars</p>
    </header>
    <main class="garden" data-garden aria-live="polite">
      <p class="garden__status" data-garden-status="loading">Opening the window…</p>
    </main>
    <footer class="build">
      <span class="build__label">build</span>
      <code data-version-stamp>%VERSION%</code>
    </footer>
    <script type="module" src="%MAIN_JS%"></script>
  </body>
</html>
