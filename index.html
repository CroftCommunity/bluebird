<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      CSP allowlist (build-plan §4): runtime origins are the public AppView
      (feed reads), the Bluesky blob CDN (images), the PLC directory (DID→PDS
      resolution), and bsky-network PDS hosts (sponsor config getRecord). Other
      PDS hosts are not statically allowlistable; the local-only config fallback
      covers sponsors off bsky-network. No inline script/style — all 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://cdn.bsky.app https://*.cdn.bsky.app; connect-src 'self' https://public.api.bsky.app https://plc.directory https://bsky.social https://*.host.bsky.network; manifest-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Skylite</title>
    <meta name="description" content="A window to the stars — a read-only, curated Bluesky garden." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="%STYLES%" />

    <meta name="theme-color" content="#14164b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Skylite" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- iOS launch splashes (portrait). Representative device set; unmatched
         devices simply fall back to no splash. -->
    <link rel="apple-touch-startup-image" href="/icons/splash/splash-2048x2732.png" media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash/splash-1640x2360.png" media="screen and (device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash/splash-1620x2160.png" media="screen and (device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash/splash-1290x2796.png" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash/splash-1170x2532.png" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash/splash-750x1334.png" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  </head>
  <body>
    <header class="topbar">
      <span class="topbar__moon" aria-hidden="true"></span>
      <h1 class="topbar__wordmark">Skylite</h1>
      <nav class="topbar__nav">
        <a href="/saves.html">Saves</a>
        <a href="/help.html">How it works</a>
      </nav>
      <button type="button" class="topbar__help" data-help-btn>Get help</button>
    </header>
    <main class="garden" data-garden aria-live="polite">
      <p class="garden__status" data-garden-status="loading">Opening the window…</p>
    </main>
    <footer class="build">
      <span class="build__label">build</span>
      <code data-version-stamp>%VERSION%</code>
    </footer>
    <script type="module" src="%MAIN_JS%"></script>
  </body>
</html>
