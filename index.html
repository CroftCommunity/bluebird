<!doctype html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      CSP allowlist (build-plan §4): runtime origins are the public AppView
      (feed reads), the Bluesky blob CDN (images), the PLC directory (DID→PDS
      resolution), and bsky-network PDS hosts (sponsor config getRecord). Other
      PDS hosts are not statically allowlistable; the local-only config fallback
      covers sponsors off bsky-network. No inline script/style — all 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://cdn.bsky.app https://*.cdn.bsky.app; connect-src 'self' https://public.api.bsky.app https://plc.directory https://bsky.social https://*.host.bsky.network; manifest-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Bluebird for Bluesky</title>
    <meta name="description" content="Bluebird — a gentle, read-first window into Bluesky." />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css?v=v1%200.1.0%2B61f70cd" integrity="sha384-7wtWR+a17eLsHylz1ouQ4H5IEwIx27dkJ+9EE8wFgeXy1qbhTGRMes3P3+TRC4Wm" crossorigin="anonymous" />
