<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://cdn.bsky.app https://*.cdn.bsky.app; connect-src 'self'; manifest-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Skylite — Saves</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="%STYLES%" />
    <meta name="theme-color" content="#14164b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Skylite" />
  </head>
  <body>
    <header class="topbar">
      <span class="topbar__moon" aria-hidden="true"></span>
      <h1 class="topbar__wordmark">Saves</h1>
      <nav class="topbar__nav">
        <a href="/">Garden</a>
        <a href="/help.html">How it works</a>
      </nav>
    </header>
    <p class="garden__note">Your Saves lives only on this device. It stays even without internet, but it is gone if Skylite is deleted.</p>
    <main class="saves garden" data-saves aria-live="polite"></main>
    <footer class="build">
      <span class="build__label">build</span>
      <code data-version-stamp>%VERSION%</code>
    </footer>
    <script type="module" src="%SAVES_JS%"></script>
  </body>
</html>
