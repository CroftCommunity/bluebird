<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Local authoring makes no network calls; Bluesky OAuth (sign-in + publish)
      adds the discovery + auth + PDS hosts to connect-src. bsky-network covers
      Bluesky's own PDSes and entryway; arbitrary self-hosted PDS/auth origins
      are not statically allowlistable (documented tradeoff, same as the reader).
      The authorize redirect is a top-level navigation, not connect-src. App
      passwords are never used.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://public.api.bsky.app https://plc.directory https://bsky.social https://*.bsky.network; manifest-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Bluebird — Patrol</title>
    <meta name="description" content="Set up and control an explorer's Bluebird garden." />
    <link rel="stylesheet" href="styles.css?v=v1%200.1.0%2Bf5d7f96" integrity="sha384-7wtWR+a17eLsHylz1ouQ4H5IEwIx27dkJ+9EE8wFgeXy1qbhTGRMes3P3+TRC4Wm" crossorigin="anonymous" />

    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
