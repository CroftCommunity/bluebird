name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the built site to the gh-pages branch

# Serialize every writer of gh-pages (this deploy + the preview workflow) so they
# never race on `git push`.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Publish dist/ to the ROOT of gh-pages, PRESERVING pr-preview/ so a
      # production deploy never wipes a live preview. The CNAME in dist/ keeps the
      # custom domain (bluebird.croft.ing). Plain git — no third-party deploy action.
      # Pages source must be "Deploy from a branch → gh-pages / root". See docs/PREVIEWS.md.
      - run: bash scripts/pages-deploy.sh root dist "deploy ${{ github.sha }} to Pages"
