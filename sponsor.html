<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Local authoring makes no network calls; Bluesky OAuth (sign-in + publish)
      adds the discovery + auth + PDS hosts to connect-src. bsky-network covers
      Bluesky's own PDSes and entryway; arbitrary self-hosted PDS/auth origins
      are not statically allowlistable (documented tradeoff, same as the reader).
      The authorize redirect is a top-level navigation, not connect-src. App
      passwords are never used.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://public.api.bsky.app https://plc.directory https://bsky.social https://*.bsky.network; manifest-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Skylite — Sponsor setup</title>
    <meta name="description" content="Set up and control an explorer's Skylite garden." />
    <link rel="stylesheet" href="%STYLES%" />
    <meta name="theme-color" content="#14164b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
  </head>
  <body class="sponsor-page">
    <header class="topbar">
      <span class="topbar__moon" aria-hidden="true"></span>
      <h1 class="topbar__wordmark">Skylite</h1>
      <p class="topbar__tagline">Sponsor setup</p>
    </header>
    <main class="sponsor" data-sponsor></main>
    <footer class="build">
      <span class="build__label">build</span>
      <code data-version-stamp>%VERSION%</code>
    </footer>
    <script type="module" src="%SPONSOR_JS%"></script>
  </body>
</html>
